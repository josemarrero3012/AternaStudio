name: Publicar la versión con casos de éxito

# Pages solo publica desde main: al subir esta rama, se relanza el despliegue
# de main, que compila también la versión con casos de éxito en su ruta
# (/AternaStudio/casos, ver pages.yml en main).
on:
  push:
    branches: [casos-de-exito]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --ref main --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
