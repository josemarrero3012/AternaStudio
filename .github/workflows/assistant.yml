name: Comprobar el asistente

# Pregunta al asistente una lista de preguntas reales en los cuatro idiomas
# (scripts/assistant-check.ts), sin modelo y con él, cada vez que cambian el
# asistente o los textos de la web.
on:
  pull_request:
    paths:
      - src/lib/assistant.ts
      - src/lib/dict.ts
      - src/lib/pricing.ts
      - public/semantic/worker.js
      - scripts/assistant-check.ts
      - scripts/fetch-semantic.mjs
      - .github/workflows/assistant.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-semantic.mjs
      - run: npm i --no-save @huggingface/transformers@4.3.1
      - run: npx -y tsx@4.20.6 scripts/assistant-check.ts
