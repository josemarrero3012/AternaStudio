name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /AternaStudio
      # Versiones de prueba, cada una en su ruta: v1-cohesion en
      # /AternaStudio/v1, v2-portfolio en /AternaStudio/v2 y v3-raiz en
      # /AternaStudio/v3. La raíz sigue siendo main. Si una rama no existe,
      # se salta.
      - name: Versiones de prueba
        run: |
          for pair in "v1:v1-cohesion" "v2:v2-portfolio" "v3:v3-raiz"; do
            dir="${pair%%:*}"; branch="${pair#*:}"
            if ! git fetch --depth 1 origin "$branch"; then
              echo "No existe $branch: se salta."
              continue
            fi
            git worktree add "../$dir" FETCH_HEAD
            (cd "../$dir" && npm ci && NEXT_PUBLIC_BASE_PATH="/AternaStudio/$dir" npm run build)
            mv "../$dir/out" "out/$dir"
          done
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
